    <script>
      (function () {
        var key = 'zhang-hang-portfolio-data';
        try {
          if (window.localStorage && !window.localStorage.getItem(key)) {
            var request = new XMLHttpRequest();
            request.open('GET', '/portfolio-data-1783243431258.json', false);
            request.send(null);
            if (request.status >= 200 && request.status < 300 && request.responseText) {
              window.localStorage.setItem(key, request.responseText);
            }
          }
        } catch (error) {}
      })();
    </script>
    <script>
      (function () {
        var key = 'zhang-hang-portfolio-data';
        try {
          var saved = window.localStorage && window.localStorage.getItem(key);
          if (!saved) return;

          var portfolio = JSON.parse(saved);
          portfolio.sections = (portfolio.sections || []).filter(function (section) {
            return section.id !== 'experience';
          });
          portfolio.experience = [];

          if (portfolio.showcase && portfolio.showcase[1]) {
            portfolio.showcase[1].images = [
              '/showcase/hrbp-resume-management/HRBP1.png',
              '/showcase/hrbp-resume-management/HRBP2.png',
              '/showcase/hrbp-resume-management/HRBP3.png',
              '/showcase/hrbp-resume-management/HRBP4.png'
            ];
          }

          window.localStorage.setItem(key, JSON.stringify(portfolio));
        } catch (error) {}
      })();
    </script>
